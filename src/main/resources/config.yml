#
# JobListings
# by refractored
#
database:
  # If you would like to use an external database, set sqlite to false.
  # Please note there is no way to migrate from sqlite to mysql, or vice versa.
  sqlite: true
  # For the url, you should only need to replace DATABASE_IP , PORT, and DATABASE_NAME.
  # jdbc:mysql://DATABASE_IP:PORT/DATABASE_NAME
  url: "jdbc:mysql://DATABASE_IP:PORT/DATABASE_NAME"
  user: "USERNAME"
  password: "PASSWORD"

# Any pending orders are orders that are not claimed by anymore.
pending-orders:
  creation:
    # If true, pending orders will be announced in chat when created, message can be edited in lang.yml
    announce: true
    hand:
      enabled: true # If true, pending orders can be created via hand
    material:
      # If true, the material command will contain stuff from presets plugin.
      use-presets: true
      # This blacklist only applies to the material command.
      # This inherits from the main blacklist.
      blacklist:
        - SPAWNER # Blacklisted because it won't have any data, and will always be a pig spawner if created with the material command
        - ENCHANTED_BOOK # Blacklisted because it won't have any data if created with the material command
      # If true, pending orders can be created via the material command
      enabled: true
  expiration:
    minimum: 48 # Minimum time in hours pending orders can be kept in the database.
    maximum: 192 # Maximum time in hours pending orders can be kept in the database.
  # Maximum amount of items per order
  # Setting this to 0 will disable the limit
  # Setting this to -1 will use the item's max stack size (May differ with material type)
  max-items: 256
  # Materials orders cant be made with.
  blacklist:
    # These materials below are blacklisted because they aren't actual stacks of items.
    # Without this, creating an order with these materials will cause issues.
    - FIRE
    - LAVA
    - WATER
    - END_PORTAL
    - END_GATEWAY
    - NETHER_PORTAL
    - AIR
    # These materials below are blacklisted by default because they are unobtainable in vanilla mc.
    - BEDROCK
    - BARRIER
    - LIGHT
    - END_PORTAL_FRAME
    - STRUCTURE_BLOCK
    - COMMAND_BLOCK
    - STRUCTURE_VOID
    - JIGSAW

claimed-orders:
  # Time is in hours.
  expiration: 336 # 336 hours (14 days)

# If an order is either not completed in time, or canceled by the owner, AND items were already turned in,
# the order will be saved as a failed order. This lets the assignee claim the items back.
failed-orders:
  # Time is in hours.
  expiration: 336 # 336 hours (14 days)

orders:
  # These two values are used if a player does not have a permission set for the max.
  # Replace X with number
  # Permissions:
  # joblistings.create.max.X
  # joblistings.accepted.max.X
  max-orders: 3
  max-accepted-orders: 3
  # Maximum/Minimum time in hours orders can be posted for
  max-order-time: 192
  min-order-time: 48
  # Time in hours to keep orders in the database after they have been fully completed
  pickup-deadline: 500
  # Deadline in hours to complete an order
  order-deadline: 32
  # Maximum amount of items per order
  # Setting this to 0 will disable the limit
  # Setting this to -1 will use the item's max stack size (May differ with material type)
  max-items: 256

# Mail is used when an order is updated and the player is offline
Mail:
  # Enable/Disable mail system
  # This will also disable the mail being sent to essentials, if that option is enabled.
  Enabled: true
  # Mail Expire time in days
  # 0 = Never expire
  ExpireTime: 30
  # All mail will be sent to this player when they join after their order is updated
  # This is in seconds.
  # This does not apply to essentials mail.
  JoinDelay: 10

# Options here require the essentials plugin to be installed!
# If EssentialsX is not installed, these options will be ignored.
# https://essentialsx.net/downloads.html
Essentials:
  # Disables the JobListings mail service and uses Essentials mail.
  # Expire time is still taken from the Mail section.
  # I prefer my mail system over Essentials. But it's your choice.
  UseEssentialsMail: false
  # When true, if a player ignores another player,
  # the player will not be able to accept orders from ignored players and
  # will not be able to accept orders from the player that ignored them.
  UseIgnoreList: false

# Options here require the Redischat plugin to be installed!
# If Redischat is not installed, these options will be ignored.
Redischat:
  # If true, when an order is created, it will be announced in the RedisChat channel.
  # Requires AnnounceOnOrderCreate to be true.
  RedisChatAnnounce: false
  # The channel to announce orders in.
  RedisChatChannel: "public"